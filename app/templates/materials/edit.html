{% extends 'base.html' %}
{% block title %}مٹیریل ترمیم — اسٹاک مینجمنٹ سسٹم{% endblock %}
{% block nav_icon %}box-seam-fill{% endblock %}
{% block page_title %}مٹیریل ریکارڈ ترمیم{% endblock %}

{% block content %}
<div dir="rtl">
    <div class="mb-3">
        <a href="{{ url_for('material_bp.list_materials') }}" class="btn-back">
            <i class="bi bi-arrow-right"></i> مٹیریلز کی فہرست
        </a>
    </div>
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-header ch-brand d-flex align-items-center gap-2">
                    <i class="bi bi-pencil-fill"></i>
                    <span>مٹیریل تبدیل کریں — {{ material.name }}</span>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('material_bp.edit_material', material_id=material.id) }}"
                          enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label">مٹیریل کا نام <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control"
                                   value="{{ material.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">پیمائش کی اکائی (Unit) <span class="text-danger">*</span></label>
                            <input type="text" name="unit" class="form-control"
                                   value="{{ material.unit }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">تصویر تبدیل کریں (اختیاری)</label>
                            <input type="file" name="image" class="form-control"
                                   accept="image/*" dir="ltr" style="text-align:left;">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">تفصیل</label>
                            <textarea name="description" class="form-control" rows="3">{{ material.description or '' }}</textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning text-dark py-2 fw-bold">
                                <i class="bi bi-arrow-clockwise me-1"></i> تبدیلیاں محفوظ کریں
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
