{% extends 'base.html' %}

{% block title %}سپلائر کا ریکارڈ تبدیل کریں — اسٹاک مینجمنٹ سسٹم{% endblock %}
{% block page_title %}سپلائر ریکارڈ ترمیم{% endblock %}

{% block content %}
<div class="container-fluid px-0 text-end" dir="rtl">

    <div class="mb-4">
        <a href="{{ url_for('supplier_bp.list_suppliers') }}" class="btn btn-light border d-inline-flex align-items-center gap-2 text-secondary">
            <i class="bi bi-arrow-right"></i> <span>فہرست میں واپس جائیں</span>
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold text-dark py-3">
                    <i class="bi bi-pencil-square text-primary me-1"></i> سپلائر کی معلومات تبدیل کریں
                </div>
                <div class="card-body p-4">

                    <form method="POST" action="{{ url_for('supplier_bp.edit_supplier', supplier_id=supplier.id) }}">

                        <div class="mb-3">
                            <label for="name" class="form-label mb-2">سپلائر کا نام <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ supplier.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label mb-2">فون نمبر / موبائل</label>
                            <input type="text" class="form-control text-start" id="phone" name="phone" value="{{ supplier.phone if supplier.phone else '' }}" dir="ltr">
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label mb-2">پتہ (Address)</label>
                            <input type="text" class="form-control" id="address" name="address" value="{{ supplier.address if supplier.address else '' }}">
                        </div>

                        <div class="mb-4">
                            <label for="opening_balance" class="form-label mb-2">ابتدائی بقایا رقم / سابقہ کھاتا</label>
                            <div class="input-group">
                                <span class="input-group-text">روپے</span>
                                <input type="number" step="0.01" class="form-control text-start" id="opening_balance" name="opening_balance" value="{{ supplier.opening_balance }}" dir="ltr">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2.5 fw-bold fs-6">
                                <i class="bi bi-check-circle me-1"></i> تبدیلیاں محفوظ کریں
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
