<!DOCTYPE html>
<html dir="rtl" lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واٹس ایپ پر شیئر کریں</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .status {
            margin-top: 30px;
            padding: 15px;
            background: #f0f8ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            text-align: right;
        }
        .status-text {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
        }
        .info-box {
            background: #fffbf0;
            border: 1px solid #ffd700;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: right;
        }
        .info-box strong {
            color: #ff8c00;
            display: block;
            margin-bottom: 8px;
        }
        .info-box p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap-reverse;
        }
        .btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-whatsapp {
            background: #25d366;
            color: white;
            flex: 2;
        }
        .btn-whatsapp:hover {
            background: #20ba5a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }
        .btn-download {
            background: #667eea;
            color: white;
        }
        .btn-download:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-back {
            background: #e0e0e0;
            color: #333;
        }
        .btn-back:hover {
            background: #d0d0d0;
        }
        .success-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .step {
            text-align: right;
            margin: 15px 0;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
        }
        .step-number {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            line-height: 30px;
            margin-left: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">واٹس ایپ پر شیئر کریں</h1>
        <p id="subtitle">براہ کرم انتظار کریں...</p>
        
        <div class="status">
            <div class="status-text" id="status">تصویر تیار ہو رہی ہے...</div>
        </div>
        
        <div class="info-box">
            <strong>⏱️ یہ عمل مکمل ہوگا:</strong>
            <p id="steps">1. تصویر خودکار ڈاؤن لوڈ ہوگی</p>
            <p>2. واٹس ایپ ڈیسک ٹاپ خودکار کھل جائے گا</p>
            <p>3. تصویر منسلک کر کے براہ راست بھیجیں</p>
        </div>
        
        <div class="button-group" id="buttons" style="display: none;">
            <a href="javascript:window.history.back()" class="btn btn-back">
                ❌ واپس جائیں
            </a>
            <a href="{{ wa_link }}" target="_blank" class="btn btn-whatsapp" id="waBtn">
                💬 واٹس ایپ کھولیں
            </a>
        </div>
    </div>

    <script>
        // Simulate processing
        setTimeout(function() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('title').textContent = 'تیار ہے!';
            document.getElementById('subtitle').textContent = 'آپ کی تصویر ڈاؤن لوڈ ہو رہی ہے اور واٹس ایپ کھولنے والا ہے...';
            document.getElementById('status').textContent = '✅ تصویر تیار ہے - واٹس ایپ کھولنے والا ہے';
            document.getElementById('buttons').style.display = 'flex';
            
            // Auto-download image if available
            const imageUrl = "{{ image_url }}";
            if (imageUrl) {
                const link = document.createElement('a');
                link.href = imageUrl;
                link.download = "{{ filename }}";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            
            // Auto-open WhatsApp Desktop after a short delay
            // Desktop URL scheme: whatsapp://send?phone=...
            // If WhatsApp Desktop is not installed, it will fail silently and user can use Web
            setTimeout(function() {
                const desktopLink = "{{ wa_link }}";
                const webLink = "{{ wa_web_link | default('') }}";
                
                // Try to open Desktop first
                if (desktopLink && desktopLink.startsWith('whatsapp://')) {
                    window.location.href = desktopLink;
                    
                    // Fallback to Web if Desktop doesn't open in 2 seconds
                    setTimeout(function() {
                        if (webLink) {
                            window.open(webLink, '_blank');
                        }
                    }, 2000);
                } else if (webLink) {
                    // If no Desktop link, use Web directly
                    window.open(webLink, '_blank');
                }
            }, 500);
        }, 1000);
    </script>
</body>
</html>
